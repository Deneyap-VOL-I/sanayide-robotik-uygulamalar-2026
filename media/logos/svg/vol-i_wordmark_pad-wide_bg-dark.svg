<svg xmlns="http://www.w3.org/2000/svg" width="682" height="229" viewBox="0 0 682 229" role="img" aria-labelledby="title desc">
	<title id="title">VOL-i Wordmark Dark Background Wide</title>

	<desc id="desc">VOL-i wordmark logo on a dark background with wide padding.</desc>

	<defs>
		<g id="logo-shapes">
			<g id="letter-V"> <path d="M96 64 H126 L157 129 L188 64 H218 L170 168 H142 Z" /> </g>

			<g id="letter-O" transform="translate(12, 0)">
				<path fill-rule="evenodd"
					d="M242 64 H327 Q339 64 347 72 Q355 80 355 92 V140 Q355 152 347 160 Q339 168 327 168
					H242 Q230 168 222 160 Q214 152 214 140 V92 Q214 80 222 72 Q230 64 242 64 Z M260 90
					H309 Q316 90 320.5 94.5 Q325 99 325 106 V126 Q325 133 320.5 137.5 Q316 142 309 142
			 		H260 Q253 142 248.5 137.5 Q244 133 244 126 V106 Q244 99 248.5 94.5 Q253 90 260 90"
			 	/>
			</g>

			<g id="letter-L" transform="translate(29, 0)"> <path d="M390 64 V141 H453 V168 H358 V64 Z" /> </g>

			<g id="dash" transform="translate(44, 0)"> <rect x="458" y="110.5" width="60" height="24" /> </g>

			<g id="letter-i" transform="translate(42, 0)">
				<g id="letter-i-stem"> <rect x="540" y="98" width="32" height="70" /> </g>
			</g>
		</g>

		<filter id="soft-edge" x="-10%" y="-20%" width="120%" height="140%">
			<feGaussianBlur stdDeviation="2.2" />
		</filter>

		<path id="dot-shape"
			d="M582 64 H617.2 V77
			Q617.2 82 613.2 84.5
			Q610.2 86 606.2 86
			H582 Z"
		/>

		<clipPath id="dot-clip" clipPathUnits="userSpaceOnUse">
			<use href="#dot-shape" />
		</clipPath>

		<g id="outline-shapes">
			<use href="#logo-shapes" />
			<use href="#dot-shape" />
		</g>

		<linearGradient id="dot-base-gradient"
			x1="582" y1="64"
			x2="582" y2="86"
			gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#ffad22" />
			<stop offset="0.58" stop-color="#f79e10" />
			<stop offset="1" stop-color="#ea8d00" />
		</linearGradient>

		<linearGradient id="dot-highlight-gradient"
			x1="582" y1="64"
			x2="588.5" y2="70.5"
			gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#ffe08a" stop-opacity="1" />
			<stop offset="0.45" stop-color="#ffc95a" stop-opacity="0.55" />
			<stop offset="1" stop-color="#ffb53a" stop-opacity="0" />
		</linearGradient>

		<linearGradient id="dot-shadow-gradient"
			x1="617.2" y1="86"
			x2="610" y2="78.8"
			gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#a95400" stop-opacity="1" />
			<stop offset="0.5" stop-color="#c96c00" stop-opacity="0.5" />
			<stop offset="1" stop-color="#de8608" stop-opacity="0" />
		</linearGradient>
	</defs>

	<rect x="0" y="0" width="682" height="229" fill="#111827" />



	<g transform="translate(-15.6 -1.5)">
		<use href="#outline-shapes"
			fill="none"
			stroke="#d5dbe5"
			stroke-width="3"
			stroke-linejoin="miter"
			opacity="0.9"
			filter="url(#soft-edge)"
		/>

		<use href="#outline-shapes"
			fill="none"
			stroke="#d5dbe5"
			stroke-width="0.5"
			stroke-linejoin="miter"
			opacity="0.72"
		/>

		<use href="#logo-shapes" fill="#001f3e" stroke="none" />

		<use href="#dot-shape" fill="url(#dot-base-gradient)" stroke="none" />

		<path fill-rule="evenodd"
			fill="url(#dot-shadow-gradient)"
			opacity="0.50"
			clip-path="url(#dot-clip)"
			d="M583.25 65.25 H617.2
			V77 Q617.2 82 613.2 84.5
			Q610.2 86 606.2 86
			H583.25 Z

			M584.75 66.75 H615.95 V77
			Q615.95 80.75 611.95 83.25
			Q608.95 84.75 606.2 84.75
			H584.75 Z"
		/>

		<path fill="url(#dot-highlight-gradient)"
			opacity="0.88"
			clip-path="url(#dot-clip)"
			d="M582 64 H617.2 V65.25 H583.25 V86 H582 Z"
		/>
	</g>
</svg>