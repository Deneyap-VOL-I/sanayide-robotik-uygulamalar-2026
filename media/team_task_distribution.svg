<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="444" viewBox="0 0 1000 444" role="img" aria-labelledby="title desc">
	<title id="title">VOL-i Takımı Görev Dağılımı</title>

	<desc id="desc">Danışman öğretmen tarafından verilen kişi ve görev tablosu.</desc>

	<defs>
